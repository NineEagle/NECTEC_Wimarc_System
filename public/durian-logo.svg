<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" fill="none">
  <defs>
    <!-- Diamond crosshatch pattern -->
    <pattern id="diamonds" patternUnits="userSpaceOnUse" width="9" height="9"
             patternTransform="rotate(45 50 68)">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#B8831A" stroke-width="0.9"/>
      <line x1="0" y1="0" x2="9" y2="0" stroke="#B8831A" stroke-width="0.9"/>
    </pattern>
    <!-- Clip to spiky body shape -->
    <clipPath id="dur">
      <path d="M50,30 L55.7,46.8 L65,42 L65.6,52.4 L82.9,49 L71.2,62.3
               L80,68 L71.2,73.7 L82.9,87 L65.6,83.6 L65,94 L55.7,89.2
               L50,106 L44.3,89.2 L35,94 L34.4,83.6 L17.1,87 L28.8,73.7
               L20,68 L28.8,62.3 L17.1,49 L34.4,52.4 L35,42 L44.3,46.8 Z"/>
    </clipPath>
  </defs>

  <!-- Stem -->
  <path d="M49 26 Q49 16 50 10 Q51 16 51 26" stroke="#4A7C3F" stroke-width="3.5"
        stroke-linecap="round" fill="none"/>

  <!-- Leaf -->
  <path d="M50 17 Q64 6 69 13 Q61 22 50 18 Z" fill="#4A7C3F"/>
  <path d="M50 17 Q38 7 33 14 Q41 23 50 18 Z" fill="#5D9450" opacity="0.8"/>

  <!-- Body fill -->
  <path d="M50,30 L55.7,46.8 L65,42 L65.6,52.4 L82.9,49 L71.2,62.3
           L80,68 L71.2,73.7 L82.9,87 L65.6,83.6 L65,94 L55.7,89.2
           L50,106 L44.3,89.2 L35,94 L34.4,83.6 L17.1,87 L28.8,73.7
           L20,68 L28.8,62.3 L17.1,49 L34.4,52.4 L35,42 L44.3,46.8 Z"
        fill="#E8B84B"/>

  <!-- Diamond texture overlay -->
  <rect x="0" y="0" width="100" height="120"
        fill="url(#diamonds)" clip-path="url(#dur)" opacity="0.55"/>

  <!-- Body outline -->
  <path d="M50,30 L55.7,46.8 L65,42 L65.6,52.4 L82.9,49 L71.2,62.3
           L80,68 L71.2,73.7 L82.9,87 L65.6,83.6 L65,94 L55.7,89.2
           L50,106 L44.3,89.2 L35,94 L34.4,83.6 L17.1,87 L28.8,73.7
           L20,68 L28.8,62.3 L17.1,49 L34.4,52.4 L35,42 L44.3,46.8 Z"
        fill="none" stroke="#C9962D" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Highlight (top-left inner glow) -->
  <ellipse cx="42" cy="54" rx="10" ry="8" fill="white" opacity="0.18"
           transform="rotate(-30 42 54)"/>
</svg>
