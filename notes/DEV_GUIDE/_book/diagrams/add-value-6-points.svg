<svg xmlns="http://www.w3.org/2000/svg" width="620" height="428" viewBox="0 0 620 428">
  <rect width="620" height="428" fill="#FFFFFF"/>
  <text x="10" y="24" font-family="Sarabun, 'Noto Sans Thai', 'Helvetica Neue', sans-serif" font-size="11" fill="#5B6B7A" text-anchor="start">เรียงจากหลังไปหน้า — backend ก่อนเสมอ จะได้ทดสอบด้วย curl ก่อนแตะหน้าเว็บ</text>
  <line x1="28" y1="63.0" x2="28" y2="333.0" stroke="#C9D6E2" stroke-width="2"/>
  <rect x="50" y="40" width="560" height="46" rx="7" fill="#E4F3F0" stroke="#0E7C6B" stroke-width="1.2"/>
  <circle cx="28" cy="63.0" r="12" fill="#0E7C6B"/>
  <text x="28" y="67.5" font-family="Sarabun, 'Noto Sans Thai', 'Helvetica Neue', sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">1</text>
  <text x="64" y="59" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#0E7C6B" text-anchor="start">backend/app/main.py</text>
  <text x="64" y="75" font-family="Sarabun, 'Noto Sans Thai', 'Helvetica Neue', sans-serif" font-size="11" fill="#5B6B7A" text-anchor="start">คำนวณค่าและใส่ลงในผลลัพธ์</text>
  <rect x="50" y="94" width="560" height="46" rx="7" fill="#E4F3F0" stroke="#0E7C6B" stroke-width="1.2"/>
  <circle cx="28" cy="117.0" r="12" fill="#0E7C6B"/>
  <text x="28" y="121.5" font-family="Sarabun, 'Noto Sans Thai', 'Helvetica Neue', sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">2</text>
  <text x="64" y="113" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#0E7C6B" text-anchor="start">backend/app/schemas.py</text>
  <text x="64" y="129" font-family="Sarabun, 'Noto Sans Thai', 'Helvetica Neue', sans-serif" font-size="11" fill="#5B6B7A" text-anchor="start">ประกาศให้ค่านี้ออกไปกับ JSON ได้</text>
  <text x="596" y="121" font-family="Sarabun, 'Noto Sans Thai', 'Helvetica Neue', sans-serif" font-size="10.5" fill="#C0392B" text-anchor="end" font-weight="600">ลืม = ค่าหายเงียบ ๆ ไม่มี error</text>
  <rect x="50" y="148" width="560" height="46" rx="7" fill="#E8F0FA" stroke="#2563A8" stroke-width="1.2"/>
  <circle cx="28" cy="171.0" r="12" fill="#2563A8"/>
  <text x="28" y="175.5" font-family="Sarabun, 'Noto Sans Thai', 'Helvetica Neue', sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">3</text>
  <text x="64" y="167" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#2563A8" text-anchor="start">services/apiMappers.ts</text>
  <text x="64" y="183" font-family="Sarabun, 'Noto Sans Thai', 'Helvetica Neue', sans-serif" font-size="11" fill="#5B6B7A" text-anchor="start">ประกาศชนิดขาเข้า แล้วแปลงเป็น camelCase</text>
  <rect x="50" y="202" width="560" height="46" rx="7" fill="#E8F0FA" stroke="#2563A8" stroke-width="1.2"/>
  <circle cx="28" cy="225.0" r="12" fill="#2563A8"/>
  <text x="28" y="229.5" font-family="Sarabun, 'Noto Sans Thai', 'Helvetica Neue', sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">4</text>
  <text x="64" y="221" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#2563A8" text-anchor="start">types/index.ts</text>
  <text x="64" y="237" font-family="Sarabun, 'Noto Sans Thai', 'Helvetica Neue', sans-serif" font-size="11" fill="#5B6B7A" text-anchor="start">ประกาศฟิลด์ใหม่ในชนิดข้อมูลฝั่งหน้าเว็บ (ใส่หน่วยในคอมเมนต์)</text>
  <rect x="50" y="256" width="560" height="46" rx="7" fill="#E8F0FA" stroke="#2563A8" stroke-width="1.2"/>
  <circle cx="28" cy="279.0" r="12" fill="#2563A8"/>
  <text x="28" y="283.5" font-family="Sarabun, 'Noto Sans Thai', 'Helvetica Neue', sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">5</text>
  <text x="64" y="275" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#2563A8" text-anchor="start">app/dashboard/page.tsx</text>
  <text x="64" y="291" font-family="Sarabun, 'Noto Sans Thai', 'Helvetica Neue', sans-serif" font-size="11" fill="#5B6B7A" text-anchor="start">วาดการ์ดแสดงผล เลียนแบบการ์ดที่มีอยู่</text>
  <rect x="50" y="310" width="560" height="46" rx="7" fill="#F1F4F7" stroke="#5B6B7A" stroke-width="1.2"/>
  <circle cx="28" cy="333.0" r="12" fill="#5B6B7A"/>
  <text x="28" y="337.5" font-family="Sarabun, 'Noto Sans Thai', 'Helvetica Neue', sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">6</text>
  <text x="64" y="329" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#5B6B7A" text-anchor="start">docker compose build backend frontend</text>
  <text x="64" y="345" font-family="Sarabun, 'Noto Sans Thai', 'Helvetica Neue', sans-serif" font-size="11" fill="#5B6B7A" text-anchor="start">build ทั้งสองฝั่งถึงจะมีผลจริง</text>
  <rect x="50" y="370" width="560" height="48" rx="7" fill="#FBEAE7" stroke="#C0392B" stroke-width="1.2"/>
  <text x="64" y="389" font-family="Sarabun, 'Noto Sans Thai', 'Helvetica Neue', sans-serif" font-size="11" fill="#C0392B" text-anchor="start" font-weight="600">ค่าไม่ขึ้นบนจอ ให้ไล่ย้อนจากจุดที่ 6 ขึ้นไป</text>
  <text x="64" y="407" font-family="Sarabun, 'Noto Sans Thai', 'Helvetica Neue', sans-serif" font-size="10.5" fill="#5B6B7A" text-anchor="start">build แล้วหรือยัง → หน้าเว็บอ่านฟิลด์ถูกชื่อไหม → curl เห็นค่าจาก backend ไหม</text>
</svg>
