<svg xmlns="http://www.w3.org/2000/svg" width="620" height="482" viewBox="0 0 620 482">
  <rect width="620" height="482" fill="#FFFFFF"/>
  <rect x="10" y="30" width="295" height="182" rx="10" fill="#FBEAE7" stroke="#C0392B" stroke-width="1.3"/>
  <rect x="22" y="20" width="96.80000000000001" height="20" rx="10" fill="#C0392B" stroke="none"/>
  <text x="31" y="34" font-family="Sarabun, 'Noto Sans Thai', 'Helvetica Neue', sans-serif" font-size="12" fill="#FFFFFF" text-anchor="start" font-weight="600">ฝังตอน build</text>
  <text x="24" y="52" font-family="Sarabun, 'Noto Sans Thai', 'Helvetica Neue', sans-serif" font-size="10.5" fill="#C0392B" text-anchor="start" font-weight="600">ต้อง build ใหม่ถึงจะเปลี่ยน</text>
  <rect x="24" y="62" width="125.1" height="24" rx="5" fill="#FBEAE7" stroke="#C0392B" stroke-width="1"/>
  <text x="33" y="78.0" font-family="Menlo, Consolas, monospace" font-size="11" fill="#C0392B" text-anchor="start">BACKEND_PROXY_URL</text>
  <rect x="24" y="94" width="112.5" height="24" rx="5" fill="#FBEAE7" stroke="#C0392B" stroke-width="1"/>
  <text x="33" y="110.0" font-family="Menlo, Consolas, monospace" font-size="11" fill="#C0392B" text-anchor="start">MEDIA_PROXY_URL</text>
  <rect x="24" y="126" width="144.0" height="24" rx="5" fill="#FBEAE7" stroke="#C0392B" stroke-width="1"/>
  <text x="33" y="142.0" font-family="Menlo, Consolas, monospace" font-size="11" fill="#C0392B" text-anchor="start">NEXT_PUBLIC_* ทุกตัว</text>
  <rect x="24" y="158" width="188.1" height="24" rx="5" fill="#FBEAE7" stroke="#C0392B" stroke-width="1"/>
  <text x="33" y="174.0" font-family="Menlo, Consolas, monospace" font-size="11" fill="#C0392B" text-anchor="start">args: ใน docker-compose.yml</text>
  <text x="24" y="202" font-family="Sarabun, 'Noto Sans Thai', 'Helvetica Neue', sans-serif" font-size="10" fill="#5B6B7A" text-anchor="start">แก้ใน environment: อย่างเดียว ไม่มีผล</text>
  <rect x="325" y="30" width="285" height="182" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.3"/>
  <rect x="337" y="20" width="84.0" height="20" rx="10" fill="#2E7D32" stroke="none"/>
  <text x="346" y="34" font-family="Sarabun, 'Noto Sans Thai', 'Helvetica Neue', sans-serif" font-size="12" fill="#FFFFFF" text-anchor="start" font-weight="600">อ่านตอนรัน</text>
  <text x="339" y="52" font-family="Sarabun, 'Noto Sans Thai', 'Helvetica Neue', sans-serif" font-size="10.5" fill="#2E7D32" text-anchor="start" font-weight="600">แก้แล้วสั่ง up -d พอ</text>
  <rect x="339" y="62" width="93.6" height="24" rx="5" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1"/>
  <text x="348" y="78.0" font-family="Menlo, Consolas, monospace" font-size="11" fill="#2E7D32" text-anchor="start">DATABASE_URL</text>
  <rect x="339" y="94" width="99.89999999999999" height="24" rx="5" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1"/>
  <text x="348" y="110.0" font-family="Menlo, Consolas, monospace" font-size="11" fill="#2E7D32" text-anchor="start">WIMARC_DB_URL</text>
  <rect x="339" y="126" width="81.0" height="24" rx="5" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1"/>
  <text x="348" y="142.0" font-family="Menlo, Consolas, monospace" font-size="11" fill="#2E7D32" text-anchor="start">JWT_SECRET</text>
  <rect x="339" y="158" width="87.3" height="24" rx="5" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1"/>
  <text x="348" y="174.0" font-family="Menlo, Consolas, monospace" font-size="11" fill="#2E7D32" text-anchor="start">TMD_API_KEY</text>
  <text x="339" y="202" font-family="Sarabun, 'Noto Sans Thai', 'Helvetica Neue', sans-serif" font-size="10" fill="#5B6B7A" text-anchor="start">อยู่ในไฟล์ .env ที่รากโปรเจกต์</text>
  <text x="10" y="246" font-family="Sarabun, 'Noto Sans Thai', 'Helvetica Neue', sans-serif" font-size="12" fill="#0E7C6B" text-anchor="start" font-weight="600">ขั้นตอน deploy</text>
  <rect x="10" y="260" width="295" height="32" rx="6" fill="#E4F3F0" stroke="#0E7C6B" stroke-width="1"/>
  <circle cx="28" cy="276" r="11" fill="#0E7C6B"/>
  <text x="28" y="280.5" font-family="Sarabun, 'Noto Sans Thai', 'Helvetica Neue', sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">1</text>
  <text x="46" y="280" font-family="Menlo, Consolas, monospace" font-size="10.5" fill="#1B2733" text-anchor="start">git commit งานของคุณก่อน</text>
  <rect x="10" y="298" width="295" height="32" rx="6" fill="#E4F3F0" stroke="#0E7C6B" stroke-width="1"/>
  <circle cx="28" cy="314" r="11" fill="#0E7C6B"/>
  <text x="28" y="318.5" font-family="Sarabun, 'Noto Sans Thai', 'Helvetica Neue', sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">2</text>
  <text x="46" y="318" font-family="Menlo, Consolas, monospace" font-size="10.5" fill="#1B2733" text-anchor="start">docker compose build backend frontend</text>
  <rect x="10" y="336" width="295" height="32" rx="6" fill="#E4F3F0" stroke="#0E7C6B" stroke-width="1"/>
  <circle cx="28" cy="352" r="11" fill="#0E7C6B"/>
  <text x="28" y="356.5" font-family="Sarabun, 'Noto Sans Thai', 'Helvetica Neue', sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">3</text>
  <text x="46" y="356" font-family="Menlo, Consolas, monospace" font-size="10.5" fill="#1B2733" text-anchor="start">docker compose up -d</text>
  <rect x="10" y="374" width="295" height="32" rx="6" fill="#E4F3F0" stroke="#0E7C6B" stroke-width="1"/>
  <circle cx="28" cy="390" r="11" fill="#0E7C6B"/>
  <text x="28" y="394.5" font-family="Sarabun, 'Noto Sans Thai', 'Helvetica Neue', sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">4</text>
  <text x="46" y="394" font-family="Menlo, Consolas, monospace" font-size="10.5" fill="#1B2733" text-anchor="start">docker compose logs -f backend</text>
  <rect x="10" y="412" width="295" height="32" rx="6" fill="#E4F3F0" stroke="#0E7C6B" stroke-width="1"/>
  <circle cx="28" cy="428" r="11" fill="#0E7C6B"/>
  <text x="28" y="432.5" font-family="Sarabun, 'Noto Sans Thai', 'Helvetica Neue', sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">5</text>
  <text x="46" y="432" font-family="Menlo, Consolas, monospace" font-size="10.5" fill="#1B2733" text-anchor="start">curl -s localhost:8000/health</text>
  <text x="325" y="246" font-family="Sarabun, 'Noto Sans Thai', 'Helvetica Neue', sans-serif" font-size="12" fill="#C0392B" text-anchor="start" font-weight="600">ย้อนกลับเมื่อ deploy แล้วพัง</text>
  <rect x="325" y="260" width="285" height="32" rx="6" fill="#FBEAE7" stroke="#C0392B" stroke-width="1"/>
  <circle cx="343" cy="276" r="11" fill="#C0392B"/>
  <text x="343" y="280.5" font-family="Sarabun, 'Noto Sans Thai', 'Helvetica Neue', sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">1</text>
  <text x="361" y="280" font-family="Menlo, Consolas, monospace" font-size="10" fill="#1B2733" text-anchor="start">git revert &lt;hash&gt;</text>
  <rect x="325" y="298" width="285" height="32" rx="6" fill="#FBEAE7" stroke="#C0392B" stroke-width="1"/>
  <circle cx="343" cy="314" r="11" fill="#C0392B"/>
  <text x="343" y="318.5" font-family="Sarabun, 'Noto Sans Thai', 'Helvetica Neue', sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">2</text>
  <text x="361" y="318" font-family="Menlo, Consolas, monospace" font-size="10" fill="#1B2733" text-anchor="start">docker compose build backend frontend</text>
  <rect x="325" y="336" width="285" height="32" rx="6" fill="#FBEAE7" stroke="#C0392B" stroke-width="1"/>
  <circle cx="343" cy="352" r="11" fill="#C0392B"/>
  <text x="343" y="356.5" font-family="Sarabun, 'Noto Sans Thai', 'Helvetica Neue', sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">3</text>
  <text x="361" y="356" font-family="Menlo, Consolas, monospace" font-size="10" fill="#1B2733" text-anchor="start">docker compose up -d</text>
  <text x="325" y="390" font-family="Sarabun, 'Noto Sans Thai', 'Helvetica Neue', sans-serif" font-size="10" fill="#C0392B" text-anchor="start">ใช้ revert ห้ามใช้ reset --hard — revert เก็บประวัติไว้ครบ</text>
  <text x="325" y="407" font-family="Sarabun, 'Noto Sans Thai', 'Helvetica Neue', sans-serif" font-size="10" fill="#5B6B7A" text-anchor="start">คนที่มาดูทีหลังจะรู้ว่าเคยมีอะไรและถูกถอนออกเพราะอะไร</text>
  <text x="310" y="462" font-family="Sarabun, 'Noto Sans Thai', 'Helvetica Neue', sans-serif" font-size="11" fill="#5B6B7A" text-anchor="middle">เปิดเว็บจริงแล้วกด Ctrl+Shift+R ตรวจหน้าที่แก้ทุกครั้งหลัง deploy</text>
</svg>
