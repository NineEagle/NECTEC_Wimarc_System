services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    environment:
      NEXT_DISABLE_TURBOPACK: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      MEDIA_PROXY_URL: "http://host.docker.internal"
      BACKEND_PROXY_URL: "http://backend:8000"
    command: >
      sh -c "if [ ! -d node_modules ]; then pnpm install; fi;
      pnpm exec next dev --webpack -H 0.0.0.0 -p 3000"
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql+psycopg2://wimarc_admin:wimarc%40dmin@host.docker.internal:5432/wimarc_db
      WIMARC_DB_URL: postgresql+psycopg2://wimarc_admin:wimarc%40dmin@host.docker.internal:5432/wimarc_db
      FILE_SERVER_URL: http://host.docker.internal
      CORS_ORIGINS: https://wimarc.in.th
      JWT_SECRET: "${JWT_SECRET}"
      TMD_API_KEY: "${TMD_API_KEY:-}"
    ports:
      - "8000:8000"

volumes:
  frontend_node_modules:
  frontend_next_cache:
